<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Bulk Ingredients">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0E5"/>
      <stop offset="100%" stop-color="#E7DFCF"/>
    </linearGradient>
    <radialGradient id="grain" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(38,60,43,0.06)"/>
      <stop offset="100%" stop-color="rgba(38,60,43,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grain)"/>
  <!-- Botanical line illustrations -->
  <g stroke="#263C2B" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M120 620 Q 260 460 200 280 Q 280 200 380 240 Q 460 300 420 420 Q 360 540 240 600 Z"/>
    <line x1="240" y1="600" x2="260" y2="320"/>
    <path d="M260 380 Q 290 360 310 380"/>
    <path d="M280 460 Q 250 440 230 470"/>
  </g>
  <g stroke="#B7B98A" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M1000 200 Q 1080 300 1040 460 Q 980 540 900 500 Q 880 360 940 260 Z"/>
    <line x1="970" y1="220" x2="980" y2="500"/>
  </g>
  <!-- Three jars in a row -->
  <g>
    <rect x="270" y="490" width="170" height="220" rx="16" fill="url(#pot2, url(#pot2))"/>
    <rect x="430" y="460" width="170" height="240" rx="16" fill="url(#pot)"/>
    <rect x="590" y="510" width="170" height="200" rx="16" fill="url(#pot2, url(#pot2))"/>
    <rect x="265" y="475" width="180" height="22" rx="8" fill="url(#lid)"/>
    <rect x="425" y="445" width="180" height="22" rx="8" fill="url(#lid)"/>
    <rect x="585" y="495" width="180" height="22" rx="8" fill="url(#lid)"/>
  </g>
  <text x="600" y="220" font-family="Georgia, serif" font-size="44" text-anchor="middle" fill="#263C2B" letter-spacing="2">BULK INGREDIENTS</text>
  <line x1="500" y1="250" x2="700" y2="250" stroke="#B96945" stroke-width="1.5"/>
  <text x="600" y="290" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#2B2D28">Larger packs · Same quality</text>
  <text x="600" y="780" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#5A5D55" letter-spacing="3">IRASHVI · DEMO CATEGORY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Irashvi hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F2E4"/>
      <stop offset="100%" stop-color="#E7DFCF"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F5A47"/>
      <stop offset="100%" stop-color="#263C2B"/>
    </linearGradient>
    <linearGradient id="pot2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0A98A"/>
      <stop offset="100%" stop-color="#B96945"/>
    </linearGradient>
    <linearGradient id="pot3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7E8D2"/>
      <stop offset="100%" stop-color="#B7B98A"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#spot)"/>
  <!-- Botanical line work -->
  <g stroke="#263C2B" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M100 780 Q 80 600 160 460 Q 240 360 320 420 Q 360 540 280 660 Q 200 760 140 780 Z"/>
    <path d="M180 780 L 200 460"/>
    <path d="M200 540 Q 240 520 260 540"/>
    <path d="M210 600 Q 170 590 150 620"/>
  </g>
  <g stroke="#B96945" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M1080 100 Q 1140 200 1100 360 Q 1040 420 980 380 Q 960 240 1020 160 Z"/>
    <path d="M1040 130 L 1050 380"/>
  </g>
  <!-- Foreground shelf -->
  <rect x="0" y="700" width="1200" height="20" fill="#263C2B" opacity="0.18"/>
  <!-- Three jars -->
  <g>
    <rect x="380" y="380" width="180" height="320" rx="20" fill="url(#pot)"/>
    <rect x="370" y="360" width="200" height="28" rx="10" fill="url(#lid)"/>
    <rect x="420" y="450" width="100" height="120" rx="6" fill="#F5F0E5" opacity="0.9"/>
    <text x="470" y="500" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#263C2B" letter-spacing="2">IRASHVI</text>
    <text x="470" y="520" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#2B2D28">DRIED CARROT</text>
  </g>
  <g>
    <rect x="610" y="320" width="180" height="380" rx="20" fill="url(#pot2)"/>
    <rect x="600" y="300" width="200" height="28" rx="10" fill="url(#lid)"/>
    <rect x="650" y="400" width="100" height="140" rx="6" fill="#F5F0E5" opacity="0.9"/>
    <text x="700" y="450" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#263C2B" letter-spacing="2">IRASHVI</text>
    <text x="700" y="470" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#2B2D28">TURMERIC POWDER</text>
  </g>
  <g>
    <rect x="840" y="400" width="160" height="300" rx="20" fill="url(#pot3)"/>
    <rect x="830" y="380" width="180" height="28" rx="10" fill="url(#lid)"/>
    <rect x="860" y="470" width="120" height="120" rx="6" fill="#F5F0E5" opacity="0.9"/>
    <text x="920" y="520" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#263C2B" letter-spacing="2">IRASHVI</text>
    <text x="920" y="540" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#2B2D28">CUMIN SEEDS</text>
  </g>
</svg>